name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-frontend:
    runs-on: ubuntu-24.04
    environment: ci-security
    permissions:
      contents: read
    env:
      HUSKY: 0
      E2E_MODE: mocked
      MOCK_API_PORT: 4010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect code changes
        # Docs-only PRs (documentation/, Markdown/MDX, LICENSES/) skip the browser
        # tests. Steps are skipped rather than the job, so required status
        # checks still report. Pushes to main always run everything.
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          code=$(printf '%s\n' "$changed" | grep -vE '^documentation/|\.mdx?$|^LICENSES/' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping browser tests."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: |
          npm install
      - name: Generate OpenAPI schemas
        run: |
          npm run generate:openapi
      - name: Run Unit Test
        run: |
          npm run test

      - name: Install Playwright Browsers
        if: steps.changes.outputs.code != 'false'
        run: npx playwright install chromium firefox

      - name: Run Playwright E2E tests
        if: steps.changes.outputs.code != 'false'
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lint
        run: |
          npm run lint
      - name: Prettier
        run: |
          npm run format
      - name: Type check
        run: |
          npm run type-check
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: SonarQube Scan
        # Fork pull requests get no secrets, so SONAR_TOKEN would be empty and
        # the scan would fail; only scan pushes and same-repository PRs.
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
