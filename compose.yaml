services:
  frontend:
    # The base image is linux/amd64 only; ARM hosts build it under emulation.
    platform: linux/amd64
    ports:
      - 3000:3000
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
